[project]
name = "amazon-gnucash"
version = "0.1.0"
description = "Turn Amazon order history into GnuCash imports, split per item"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.44.2",
    "pydantic>=2.13.5",
]

[project.scripts]
amazon-gnucash = "amazon_gnucash.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "selectolax>=0.4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
